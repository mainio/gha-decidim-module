name: "Decidim: Setup app"
description: Decidim module setup (test app generation)
author: mainio
inputs:
  use-cached-app:
    description: Adds the generated test application to the cache.
    required: false
    default: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
        rubygems: latest
    - run: |
          DECIDIM_VERSION=$(grep -E '^[[:space:]]+decidim-core \([0-9]+\.[0-9]+\.[0-9]+\)' Gemfile.lock | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$DECIDIM_VERSION" ]; then
            DECIDIM_VERSION=$(grep -E '^[[:space:]]+decidim \([0-9]+\.[0-9]+\.[0-9]+\)' Gemfile.lock | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          fi
          DECIDIM_VERSION=${DECIDIM_VERSION:-0.0.0}
          MAJOR_MINOR=$(echo "$DECIDIM_VERSION" | cut -d. -f1,2)
          echo "Detected Decidim version: $DECIDIM_VERSION"
          if [ "$(printf '%s\n' "0.32" "$MAJOR_MINOR" | sort -V | head -n1)" = "0.32" ]; then
            echo "processor=vips" >> "$GITHUB_OUTPUT"
          else
            echo "processor=mini_magick" >> "$GITHUB_OUTPUT"
          fi
      id: detect-image-processor
      name: Detect required image processor
      shell: "bash"
    - run: sudo apt-get update && sudo apt-get install -y imagemagick
      name: Install ImageMagick
      shell: "bash"
      if: ${{ steps.detect-image-processor.outputs.processor == 'mini_magick' }}
    - run: sudo apt-get update && sudo apt-get install -y libvips-dev libvips-tools
      name: Install libvips
      shell: "bash"
      if: ${{ steps.detect-image-processor.outputs.processor == 'vips' }}
    - run: (test -f package-lock.json && echo "available=true" || echo "available=false") >> $GITHUB_OUTPUT
      id: decidim-app-package-lock-availability
      name: Check for package-lock.json
      shell: "bash"
    - uses: actions/setup-node@v3
      with:
        cache: npm
        cache-dependency-path: ./package-lock.json
      if: ${{ fromJSON(steps.decidim-app-package-lock-availability.outputs.available) }}
    - uses: actions/cache@v3
      id: decidim-app-cache
      with:
        path: ./spec/decidim_dummy_app/
        key: decidim-app-${{ github.sha }}
        restore-keys: decidim-app-${{ github.sha }}
      if: ${{ fromJSON(inputs.use-cached-app) }}
    - run: bundle exec rake test_app
      name: Create test app
      shell: "bash"
    - run: mkdir -p ./spec/decidim_dummy_app/tmp/screenshots
      name: Create the screenshots folder
      shell: "bash"
    - run: |
        node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          pkg.overrides = Object.assign(pkg.overrides || {}, { graphql: '15.10.1' });
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
        "
        rm -rf node_modules package-lock.json
        npm install
      working-directory: ./spec/decidim_dummy_app
      name: Lock graphql to version 15
      shell: "bash"
    - run: RAILS_ENV=test bundle exec rails assets:precompile
      name: Precompile assets
      working-directory: ./spec/decidim_dummy_app/
      shell: "bash"
