name: "Decidim: Test RSpec"
description: Decidim module tests (RSpec)
author: mainio
inputs:
  use-cached-app:
    description: Loads the generated test application from the cache also loads the DB schema for the cached app.
    required: false
    default: true
  load-schema:
    description: Loads the DB schema in case the database has not been initialized.
    required: false
    default: false
  db-migrate:
    description: Runs the normal migration process instead of loading the DB from the schema.
    required: false
    default: false
  codecov-token:
    description: The Codecov token
    required: false
runs:
  using: composite
  steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1
    # Note that the cache action needs to come after the checkout because it
    # deletes the whole folder.
    - uses: actions/cache@v3
      id: decidim-app-cache
      with:
        path: ./spec/decidim_dummy_app/
        key: decidim-app-${{ github.sha }}
        restore-keys: decidim-app-${{ github.sha }}
      if: ${{ fromJSON(inputs.use-cached-app) }}
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
        rubygems: latest
    - run: |
          DECIDIM_VERSION=$(bundle exec ruby -e "require 'decidim/version';
          puts Decidim::VERSION" 2>/dev/null || echo "0.0.0")
          MAJOR_MINOR=$(echo "$DECIDIM_VERSION" | cut -d. -f1,2)
          echo "Detected Decidim version: $DECIDIM_VERSION"
          if [ "$(printf '%s\n' "0.32" "$MAJOR_MINOR" | sort -V | head -n1)" = "0.32" ]; then
            echo "processor=vips" >> "$GITHUB_OUTPUT"
          else
            echo "processor=mini_magick" >> "$GITHUB_OUTPUT"
          fi
      id: detect-image-processor
      name: Detect required image processor
      shell: "bash"
    - run: sudo apt-get update && sudo apt-get install -y imagemagick
      name: Install ImageMagick
      shell: "bash"
      if: ${{steps.detect-image-processor.outputs.processor == 'mini_magick' }}
    - run: sudo apt-get update && sudo apt-get install -y libvips-dev libvips-tools
      name: Install libvips
      shell: "bash"
      if: ${{ steps.detect-image-processor.outputs.processor == 'vips' }}
    - uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: stable
    - run: bundle exec rails db:purge db:schema:load
      name: Load DB schema
      shell: "bash"
      working-directory: ./spec/decidim_dummy_app/
      env:
        RAILS_ENV: test
      if: ${{ !fromJSON(inputs.db-migrate) && (fromJSON(inputs.use-cached-app) || fromJSON(inputs.load-schema)) }}
    - run: bundle exec rails db:purge db:migrate
      name: Migrate DB
      shell: "bash"
      working-directory: ./spec/decidim_dummy_app/
      env:
        RAILS_ENV: test
      if: ${{ fromJSON(inputs.db-migrate) }}
    - run: bundle exec rspec
      name: RSpec
      shell: "bash"
    - uses: codecov/codecov-action@v5
      with:
        token: ${{ inputs.codecov-token }}
        slug: ${{ github.repository }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots
        path: ./spec/decidim_dummy_app/tmp/screenshots
        if-no-files-found: ignore
