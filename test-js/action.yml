name: "Decidim: Test JavaScript"
description: Decidim module tests (JS)
author: mainio
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - uses: actions/setup-node@v7
      with:
        cache: npm
        cache-dependency-path: ./package-lock.json
    - name: Install JS dependencies
      run: npm ci
      shell: "bash"
    - name: Test JS files
      run: npm run test
      shell: "bash"
