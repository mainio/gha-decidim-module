on:
  workflow_call:
    inputs:
      db-migrate:
        description: Runs full DB migrations instead of loading the DB from the schema.
        required: false
        default: false
        type: boolean
      image-processor:
        description: "Image processor: 'mini_magick' (default) or 'vips'"
        required: false
        default: mini_magick
        type: string
    secrets:
      CODECOV_TOKEN:
        required: true
jobs:
  test_rspec:
    name: Test app (RSpec)
    runs-on: ubuntu-latest
    if: "!startsWith(github.head_ref, 'chore/l10n')"
    timeout-minutes: 60
    env:
      CI: "true"
      CODECOV: "true" # legacy
      SIMPLECOV: "true"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      RUBYOPT: '-W:no-deprecated'
      DISABLE_SPRING: "true"
    services:
      postgres:
        image: postgres:14
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres
    steps:
      - uses: mainio/gha-decidim-module/test-rspec@main
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          db-migrate: ${{ inputs.db-migrate }}
          image-processor: ${{ inputs.image-processor }}
