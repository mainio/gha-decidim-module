on:
  workflow_call:
    inputs:
      postgres-version:
        description: PostgreSQL version
        required: false
        default: 14
        type: string
jobs:
  build_app:
    name: Build app
    runs-on: ubuntu-latest
    if: "!startsWith(github.head_ref, 'chore/l10n')"
    timeout-minutes: 60
    env:
      RUBYOPT: '-W:no-deprecated'
      DISABLE_SPRING: "true"
      POSTGRES_VERSION: ${{ inputs.postgres-version }}
    steps:
      - uses: mainio/gha-decidim-module/setup-app@main
