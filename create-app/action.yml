name: "Decidim: Create app"
description: Decidim module setup (test app creation)
author: mainio
inputs:
  use-cached-app:
    description: Adds the generated test application to the cache.
    required: false
    default: true
runs:
  using: composite
  steps:
    - uses: mainio/gha-decidim-module/setup-ruby-runtime@next
    - run: (test -f package-lock.json && echo "available=true" || echo "available=false") >> $GITHUB_OUTPUT
      id: decidim-app-package-lock-availability
      name: Check for package-lock.json
      shell: "bash"
    - uses: actions/setup-node@v7
      with:
        cache: npm
        cache-dependency-path: ./package-lock.json
      if: ${{ fromJSON(steps.decidim-app-package-lock-availability.outputs.available) }}
    - run: |
        docker run --name tmp_postgres \
          -e POSTGRES_PASSWORD=postgres \
          -p 5432:5432 \
          -d postgres:${{ env.POSTGRES_VERSION }}
      name: Temporary Postgres Container
      shell: "bash"
    - run: |
        echo "Waiting for PostgreSQL to accept connections..."
        for i in {1..30}; do
          if docker exec tmp_postgres pg_isready -d "${{ inputs.postgres_db }}"; then
            echo "PostgreSQL is up and running!"
            exit 0
          fi
          echo "Database is not ready yet... retrying in 1 second ($i/30)"
          sleep 1
        done
        echo "Error: PostgreSQL failed to start."
        docker logs tmp_postgres
        exit 1
      env:
        POSTGRES_PASSWORD: postgres
      name: Wait for Postgres to be ready
      shell: "bash"
    - run: bundle exec rake test_app
      name: Create test app
      env:
        DATABASE_USERNAME: postgres
        DATABASE_PASSWORD: postgres
        DATABASE_HOST: localhost
      shell: "bash"
      if: ${{ steps.decidim-app-cache.outputs.cache-hit != 'true' }}
    - run: mkdir -p ./spec/decidim_dummy_app/tmp/screenshots
      name: Create the screenshots folder
      shell: "bash"
    - run: |
        node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          pkg.overrides = Object.assign(pkg.overrides || {}, { graphql: '15.10.1' });
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
        "
        rm -rf node_modules package-lock.json
        npm install
      working-directory: ./spec/decidim_dummy_app
      name: Lock graphql to version 15
      shell: "bash"
    - run: RAILS_ENV=test bundle exec rails assets:precompile
      name: Precompile assets
      working-directory: ./spec/decidim_dummy_app/
      shell: "bash"
